<script type="text/plain" id="wk-src">/* ===== Maddah Console DSP worklets ===== */
function mxFFT(n){
  const bits=Math.round(Math.log2(n)), rev=new Uint32Array(n), cs=new Float64Array(n/2), sn=new Float64Array(n/2);
  for(let i=0;i<n;i++){let r=0,x=i;for(let b=0;b<bits;b++){r=(r<<1)|(x&1);x>>=1;}rev[i]=r;}
  for(let i=0;i<n/2;i++){const a=-2*Math.PI*i/n;cs[i]=Math.cos(a);sn[i]=Math.sin(a);}
  return function(re,im,inv){
    for(let i=0;i<n;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t;}}
    for(let size=2;size<=n;size<<=1){
      const half=size>>1,step=n/size;
      for(let i=0;i<n;i+=size){
        for(let j=0,k=0;j<half;j++,k+=step){
          const wr=cs[k],wi=inv?-sn[k]:sn[k],a=i+j,b=a+half;
          const tr=re[b]*wr-im[b]*wi,ti=re[b]*wi+im[b]*wr;
          re[b]=re[a]-tr;im[b]=im[a]-ti;re[a]+=tr;im[a]+=ti;
        }
      }
    }
    if(inv){for(let i=0;i<n;i++){re[i]/=n;im[i]/=n;}}
  };
}

/* ---- Spectral noise reducer (STFT, 1024 / hop 256, spectral subtraction with smoothing) ---- */
class MxNR extends AudioWorkletProcessor{
  constructor(){
    super();
    const N=1024,H=256;this.N=N;this.H=H;this.nb=N/2+1;
    this.fft=mxFFT(N);
    this.win=new Float64Array(N);for(let i=0;i<N;i++)this.win[i]=0.5-0.5*Math.cos(2*Math.PI*i/N);
    this.re=new Float64Array(N);this.im=new Float64Array(N);
    this.inBuf=new Float64Array(N);this.acc=new Float64Array(N);
    this.hopIn=new Float64Array(H);this.hopN=0;
    this.fifo=new Float32Array(H*8);this.fr=0;this.fw=0;this.fc=0;
    this.Psm=new Float64Array(this.nb);this.Nz=new Float64Array(this.nb);this.G=new Float64Array(this.nb);this.Gs=new Float64Array(this.nb).fill(1);
    this.prof=null;this.learn=0;this.learnSum=new Float64Array(this.nb);this.learnTotal=0;
    this.enabled=false;this.floor=Math.pow(10,-12/20);this.over=1.5;this.first=true;this.frames=0;
    this.rise=Math.pow(10,(5/10)/(sampleRate/H)); // ~5 dB/s floor-tracker rise
    this.emin=0;
    this.scale=1/1.5;
    this.port.onmessage=e=>{
      const d=e.data;
      if(d.cmd==='cfg'){this.enabled=!!d.enabled;this.floor=Math.pow(10,Math.min(0,d.floorDb)/20);this.over=d.over;}
      else if(d.cmd==='learn'){this.learn=Math.round(d.sec*sampleRate/H);this.learnTotal=this.learn;this.learnSum.fill(0);this.learnN=0;}
      else if(d.cmd==='clear'){this.prof=null;}
    };
  }
  frame(){
    const N=this.N,nb=this.nb,re=this.re,im=this.im,w=this.win,ib=this.inBuf;
    for(let i=0;i<N;i++){re[i]=ib[i]*w[i];im[i]=0;}
    this.fft(re,im,false);
    const Psm=this.Psm,Nz=this.Nz,G=this.G,Gs=this.Gs,eps=1e-14;
    for(let k=0;k<nb;k++){
      const p=re[k]*re[k]+im[k]*im[k];
      Psm[k]=this.first?p:0.5*Psm[k]+0.5*p;
      if(this.first)Nz[k]=p;
    }
    this.first=false;
    if(this.learn>0){
      for(let k=0;k<nb;k++)this.learnSum[k]+=Psm[k];
      this.learnN=(this.learnN||0)+1;this.learn--;
      if(this.learn===0){
        const pr=new Float64Array(nb);for(let k=0;k<nb;k++)pr[k]=this.learnSum[k]/this.learnN*1.3;
        this.prof=pr;this.port.postMessage({type:'learned'});
      }else if((this.learn&15)===0)this.port.postMessage({type:'progress',p:1-this.learn/this.learnTotal});
    }
    // noise estimate: VAD-gated running mean of the power spectrum (learned profile overrides)
    if(this.prof){for(let k=0;k<nb;k++)Nz[k]=this.prof[k];}
    else{
      let et=0;for(let k=2;k<nb-2;k++)et+=Psm[k];
      if(this.frames===0||et<this.emin)this.emin=et;else this.emin*=this.rise;
      this.frames++;
      if(et<this.emin*3.0||this.frames<25){const r=this.frames<40?0.15:0.04;for(let k=0;k<nb;k++)Nz[k]+=(Psm[k]-Nz[k])*r;}
    }
    const over=this.over,fl=this.floor,fl2=fl*fl;
    for(let k=0;k<nb;k++){
      let g2=1-over*Nz[k]/(Psm[k]+eps);
      if(g2<fl2)g2=fl2;
      G[k]=Math.sqrt(g2);
    }
    // smooth across frequency then time (fast attack, slower release)
    for(let k=0;k<nb;k++){
      const a=G[k>0?k-1:0],b=G[k],c=G[k<nb-1?k+1:nb-1];
      let g=(a+2*b+c)*0.25;
      g=g>Gs[k]?0.4*Gs[k]+0.6*g:0.82*Gs[k]+0.18*g;
      Gs[k]=g;
    }
    for(let k=0;k<nb;k++){re[k]*=Gs[k];im[k]*=Gs[k];if(k>0&&k<N/2){re[N-k]=re[k];im[N-k]=-im[k];}}
    this.fft(re,im,true);
    const acc=this.acc,sc=this.scale;
    for(let i=0;i<N;i++)acc[i]+=re[i]*w[i]*sc;
  }
  process(inputs,outputs){
    const inp=inputs[0][0],out=outputs[0][0];
    if(!out)return true;
    const len=out.length;
    if(!inp){out.fill(0);return true;}
    if(!this.enabled){
      out.set(inp);
      if(this.hopN||this.fc){this.hopN=0;this.fc=0;this.fr=this.fw=0;this.inBuf.fill(0);this.acc.fill(0);this.first=true;this.frames=0;}
      return true;
    }
    const H=this.H,N=this.N;
    for(let i=0;i<len;i++){
      this.hopIn[this.hopN++]=inp[i];
      if(this.hopN===H){
        const ib=this.inBuf;
        ib.copyWithin(0,H);
        for(let j=0;j<H;j++)ib[N-H+j]=this.hopIn[j];
        this.hopN=0;
        this.frame();
        const sz=this.fifo.length;
        for(let j=0;j<H;j++){this.fifo[this.fw]=this.acc[j];this.fw=(this.fw+1)%sz;}
        this.fc+=H;
        this.acc.copyWithin(0,H);this.acc.fill(0,N-H);
      }
    }
    const sz=this.fifo.length;
    for(let i=0;i<len;i++){
      if(this.fc>0){out[i]=this.fifo[this.fr];this.fr=(this.fr+1)%sz;this.fc--;}else out[i]=0;
    }
    return true;
  }
}
registerProcessor('mx-nr',MxNR);

/* ---- Time-domain vocal dynamics: gate / breath / de-esser / AGC (mono) ---- */
class MxDyn extends AudioWorkletProcessor{
  constructor(){
    super();
    const sr=sampleRate;this.sr=sr;
    this.LA=Math.round(0.003*sr);this.dl=new Float32Array(this.LA+1);this.dp=0;
    this.cfg={gate:{on:false,thr:-55,range:-40,att:2,hold:80,rel:180},deess:{on:false,amt:.5,thr:-34,f:5500},breath:{on:false,amt:8},agc:{on:false,target:-20,max:12}};
    this.env=0;this.open=false;this.holdN=0;this.gg=1;
    this.setDeess();
    this.hz1=0;this.hz2=0;this.w1=0;this.w2=0;this.q0=1;this.q1=0;this.q2=0;this.qa2=0;this.be=0;this.dsg=1;this.dsRed=0;
    this.l1=0;this.l3=0;this.eLo=0;this.eHi=0;this.vp=0;this.bg=1;
    this.ms=0;this.agcDb=0;this.agcG=1;
    this.pk=0;this.cnt=0;
    this.relEnv=Math.exp(-1/(sr*0.010));
    this.port.onmessage=e=>{if(e.data.cmd==='cfg'){Object.assign(this.cfg.gate,e.data.gate);Object.assign(this.cfg.deess,e.data.deess);Object.assign(this.cfg.breath,e.data.breath);Object.assign(this.cfg.agc,e.data.agc);this.setDeess();}};
  }
  setDeess(){
    const f=this.cfg.deess.f,sr=this.sr,w0=2*Math.PI*f*0.8/sr,c=Math.cos(w0),sn=Math.sin(w0),al=sn/(2*0.707),a0=1+al;
    this.b0=(1+c)/2/a0;this.b1=-(1+c)/a0;this.b2=(1+c)/2/a0;this.a1=-2*c/a0;this.a2=(1-al)/a0;
    const wp=2*Math.PI*f/sr;this.pc=Math.cos(wp);this.ps=Math.sin(wp);
  }
  process(inputs,outputs){
    const inp=inputs[0][0],out=outputs[0][0];
    if(!out)return true;
    const n=out.length,sr=this.sr,C=this.cfg,g=C.gate,d=C.deess,b=C.breath,a=C.agc;
    if(!inp){out.fill(0);return true;}
    const thr=Math.pow(10,g.thr/20),closeThr=thr*0.7,rng=Math.pow(10,g.range/20);
    const aC=1-Math.exp(-1/(sr*Math.max(0.0005,g.att/1000))),rC=1-Math.exp(-1/(sr*Math.max(0.01,g.rel/1000)));
    const holdS=g.hold/1000*sr;
    const dThr=Math.pow(10,d.thr/20),maxRed=d.amt*14;
    const dA=1-Math.exp(-1/(sr*0.0008)),dR=1-Math.exp(-1/(sr*0.03)),beR=Math.exp(-1/(sr*0.02));
    const bA=1-Math.exp(-1/(sr*0.008)),bR=1-Math.exp(-1/(sr*0.06)),bamt=Math.pow(10,-b.amt/20),vpD=Math.exp(-1/(sr*3));
    const k1=1-Math.exp(-2*Math.PI*1000/sr),k3=1-Math.exp(-2*Math.PI*3500/sr),eC=1-Math.exp(-1/(sr*0.01));
    const LA=this.LA,dl=this.dl,DL=dl.length;
    const msC=1/(sr*0.4);
    let sumSq=0;
    for(let i=0;i<n;i++){
      const x=inp[i];
      // detector on undelayed signal
      const ax=x<0?-x:x;
      this.env=ax>this.env?ax:this.env*this.relEnv;
      if(g.on){
        if(this.env>thr){this.open=true;this.holdN=holdS;}
        else if(this.open){if(this.holdN>0)this.holdN--;else if(this.env<closeThr)this.open=false;}
        const tg=this.open?1:rng;

      }else this.bg+=(1-this.bg)*0.01;

      this.ms+=msC*(y*y-this.ms);

  }
}

/* ---- PCM recorder ---- */
class MxRec extends AudioWorkletProcessor{
  constructor(o){
    super();
    this.ch=(o.processorOptions&&o.processorOptions.ch)||1;this.on=false;this.size=4096;this.pos=0;
    this.buf=[];for(let c=0;c<this.ch;c++)this.buf.push(new Float32Array(this.size));
    this.port.onmessage=e=>{if(e.data.cmd==='rec'){this.on=!!e.data.on;if(!this.on)this.flush();}};
  }
  flush(){
    if(!this.pos)return;
    const out=this.buf.map(b=>b.slice(0,this.pos));
    this.port.postMessage({chunks:out,n:this.pos},out.map(a=>a.buffer));
    this.pos=0;
  }
  process(inputs){
    if(!this.on)return true;
    const inp=inputs[0],n=128;
    for(let c=0;c<this.ch;c++){
      const src=inp[c]||inp[0];
      if(src)this.buf[c].set(src,this.pos);else this.buf[c].fill(0,this.pos,this.pos+n);
    }
    this.pos+=n;
    if(this.pos>=this.size)this.flush();
    return true;
  }
}
registerProcessor('mx-rec',MxRec);

/* ================= Controls binding ================= */
const BIND={},APPLY={};
function bind(path,fn){(BIND[path]=BIND[path]||[]).push(fn);fn(getPath(S,path));}
function commit(path,val,opts){
  setPath(S,path,val);
  (BIND[path]||[]).forEach(f=>f(val));
  if(!(opts&&opts.silent)){
    if(!(opts&&opts.nomod)&&path!=='lang'&&!path.startsWith('set.')&&!path.startsWith('exp.')&&!path.startsWith('rec.')&&!/^(ch\d\.(on|mute|solo|fader|trim|pan|dev|bypass|vol|src)|master\.(fader|mute|outDev)|master\.hp\..*)$/.test(path)){S.modified=true;document.dispatchEvent(new Event('presetmod'));}
    const g=path.split('.')[0];
    if(APPLY[g])APPLY[g](path);
    saveSoon();
  }
}
function refreshBindings(){for(const p in BIND){let v;try{v=getPath(S,p);}catch(e){continue;}BIND[p].forEach(f=>f(v));}}
function saveState(){
  try{
    const s=deepClone(S);
    localStorage.setItem(LS_KEY,JSON.stringify({S:s,user:USER_PRESETS,fx:FX_PRESETS,custom:CUSTOM_SLOT}));
  }catch(e){}
}
const saveSoon=debounce(saveState,500);
function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);if(!raw)return;
    const d=JSON.parse(raw);
    if(d.S)deepMerge(S,d.S);
    USER_PRESETS=Array.isArray(d.user)?d.user:[];FX_PRESETS=Array.isArray(d.fx)?d.fx:[];CUSTOM_SLOT=d.custom||null;

}

/* ---- value formatters ---- */
const sg=v=>v>0.049?'+':'';
const FMT={
  db1:v=>sg(v)+v.toFixed(1)+' dB',db0:v=>sg(v)+Math.round(v)+' dB',db2:v=>v.toFixed(1)+' dB',
  hz:v=>v>=1000?(v/1000).toFixed(v>=10000?1:2)+' kHz':Math.round(v)+' Hz',
  ms:v=>(v>=100?Math.round(v):v.toFixed(v<10?1:0))+' ms',s:v=>v.toFixed(2)+' s',sec:v=>v.toFixed(1)+' s',
  pct:v=>Math.round(v*100)+'%',ratio:v=>v.toFixed(1)+':1',x:v=>v.toFixed(1),q:v=>v.toFixed(1),
  pan:v=>Math.abs(v)<.02?'C':(v<0?'L':'R')+Math.round(Math.abs(v)*100),
  pre:v=>Math.round(v*1000)+' ms',etime:v=>Math.round(v*1000)+' ms',int:v=>String(Math.round(v)),
  fader:v=>{const d=faderDb(v);return d<=-80?'-∞':(d>0?'+':'')+d.toFixed(1)+' dB';},
  vol:v=>Math.round(v*100)+'%'
};
const FADER_PTS=[[0,-80],[.12,-50],[.3,-25],[.5,-10],[.75,0],[1,6]];
function faderDb(p){p=clamp(p,0,1);if(p<=0.005)return -80;for(let i=1;i<FADER_PTS.length;i++){if(p<=FADER_PTS[i][0]){const a=FADER_PTS[i-1],b=FADER_PTS[i];return a[1]+(b[1]-a[1])*(p-a[0])/(b[0]-a[0]);}}return 6;}
const faderGain=p=>{const d=faderDb(p);return d<=-79?0:dbToLin(d);};

/* ---- Knob ---- */
function mkKnob(d){
  const min=+d.min,max=+d.max,def=+d.def,log=!!d.log,fmt=FMT[d.fmt]||FMT.x,path=d.path,step=+d.step||0;
  const toPos=v=>log?Math.log(clamp(v,min,max)/min)/Math.log(max/min):(clamp(v,min,max)-min)/(max-min);
  const fromPos=p=>{p=clamp(p,0,1);let v=log?min*Math.pow(max/min,p):min+p*(max-min);if(step)v=Math.round(v/step)*step;return clamp(v,min,max);};
  const root=el('div',{class:'knob k-'+(d.size||'m'),tabindex:'0',role:'slider','aria-label':d.label});
  root.innerHTML=`<span class="k-lab" data-i18n="${d.label}">${t(d.label)}</span><div class="k-body"><svg viewBox="0 0 100 100"><path class="k-trk"/><path class="k-val"/></svg><div class="k-cap"><i class="k-ind"></i></div></div><span class="k-read"></span>`;
  const trk=$('.k-trk',root),val=$('.k-val',root),cap=$('.k-cap',root),read=$('.k-read',root);
  const A0=-135,A1=135,R=42;
  const pt=a=>{const r=(a-90)*Math.PI/180;return[50+R*Math.cos(r),50+R*Math.sin(r)];};
  const arc=(a,b)=>{const[x0,y0]=pt(a),[x1,y1]=pt(b);return`M${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${Math.abs(b-a)>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;};
  trk.setAttribute('d',arc(A0,A1));
  const bip=min<0&&max>0&&!log;
  let cur=def;
  function render(v){
    cur=v;const p=toPos(v),a=A0+p*(A1-A0);
    cap.style.transform=`rotate(${a}deg)`;
    if(bip){const z=A0+toPos(0)*(A1-A0);val.setAttribute('d',Math.abs(a-z)<.5?'':arc(Math.min(a,z),Math.max(a,z)));}
    else val.setAttribute('d',p<.004?'':arc(A0,a));
    read.textContent=fmt(v);root.setAttribute('aria-valuenow',v);root.setAttribute('aria-valuetext',fmt(v));
  }
  bind(path,render);
  const set=v=>{v=clamp(v,min,max);if(v!==cur)commit(path,v);};
  let drag=null,lastUp=0;
  root.addEventListener('pointerdown',e=>{
    if(e.button>0)return;root.setPointerCapture(e.pointerId);
    drag={y:e.clientY,x:e.clientX,p:toPos(cur),moved:false};root.classList.add('act');e.preventDefault();root.focus({preventScroll:true});
  });
  root.addEventListener('pointermove',e=>{
    if(!drag)return;const dy=drag.y-e.clientY,dx=e.clientX-drag.x;
    if(Math.abs(dy)+Math.abs(dx)>3)drag.moved=true;
    const sens=e.shiftKey?600:(e.pointerType==='touch'?170:200);
    set(fromPos(drag.p+(dy+dx*0.3)/sens));
  });
  const up=e=>{
    if(!drag)return;const mv=drag.moved;drag=null;root.classList.remove('act');
    if(!mv){const n=performance.now();if(n-lastUp<350){commit(path,def);}lastUp=n;}
  };
  root.addEventListener('pointerup',up);root.addEventListener('pointercancel',up);
  root.addEventListener('dblclick',()=>commit(path,def));
  root.addEventListener('wheel',e=>{e.preventDefault();set(fromPos(toPos(cur)-Math.sign(e.deltaY)*(e.shiftKey?.005:.025)));},{passive:false});
  root.addEventListener('keydown',e=>{
    const k=e.key,inc=k==='ArrowUp'||k==='ArrowRight'?1:k==='ArrowDown'||k==='ArrowLeft'?-1:0;
    if(inc){set(fromPos(toPos(cur)+inc*(e.shiftKey?.005:.02)));e.preventDefault();}
    else if(k==='Home'){commit(path,def);e.preventDefault();}
  });
  return root;
}

/* ---- Fader ---- */
function mkFader(d){
  const path=d.path,min=+(d.min??0),max=+(d.max??1),def=+(d.def??.75),fmt=FMT[d.fmt||'fader'];
  const root=el('div',{class:'fader '+(d.cls||''),tabindex:'0',role:'slider','aria-label':d.label});
  const ticks=d.ticks?d.ticks.split(',').map(x=>`<i style="bottom:calc((100% - 30px)*${x}+15px)"></i>`).join(''):'';
  root.innerHTML=`<div class="f-trk"><div class="f-slot"></div>${ticks}<div class="f-cap"><i></i></div></div><span class="f-read"></span><span class="f-lab" data-i18n="${d.label}">${t(d.label)}</span>`;
  const trk=$('.f-trk',root),cap=$('.f-cap',root),read=$('.f-read',root);
  const toPos=v=>(clamp(v,min,max)-min)/(max-min),fromPos=p=>min+clamp(p,0,1)*(max-min);
  let cur=def;
  function render(v){cur=v;cap.style.bottom=`calc((100% - 30px)*${toPos(v)})`;read.textContent=fmt(v);root.setAttribute('aria-valuenow',v);}
  bind(path,render);
  const set=v=>{v=clamp(Math.round(v*1000)/1000,min,max);if(v!==cur)commit(path,v);};
  let drag=null,lastUp=0;
  const posFromY=(y,off)=>{const r=trk.getBoundingClientRect();return 1-(y-off-r.top-15)/(r.height-30);};
  root.addEventListener('pointerdown',e=>{
    if(e.button>0)return;root.setPointerCapture(e.pointerId);e.preventDefault();root.focus({preventScroll:true});
    const cr=cap.getBoundingClientRect();let off=0;
    if(e.target.closest('.f-cap'))off=e.clientY-(cr.top+cr.height/2);else set(fromPos(posFromY(e.clientY,0)));
    drag={off,moved:false,y:e.clientY};root.classList.add('act');
  });
  root.addEventListener('pointermove',e=>{if(!drag)return;if(Math.abs(e.clientY-drag.y)>3)drag.moved=true;set(fromPos(posFromY(e.clientY,drag.off)));});
  const up=()=>{if(!drag)return;const mv=drag.moved;drag=null;root.classList.remove('act');if(!mv){const n=performance.now();if(n-lastUp<350)commit(path,def);lastUp=n;}};
  root.addEventListener('pointerup',up);root.addEventListener('pointercancel',up);
  root.addEventListener('dblclick',()=>commit(path,def));
  root.addEventListener('wheel',e=>{e.preventDefault();set(fromPos(toPos(cur)-Math.sign(e.deltaY)*.02));},{passive:false});
  root.addEventListener('keydown',e=>{const k=e.key,inc=k==='ArrowUp'||k==='ArrowRight'?1:k==='ArrowDown'||k==='ArrowLeft'?-1:0;if(inc){set(fromPos(toPos(cur)+inc*(e.shiftKey?.005:.02)));e.preventDefault();}else if(k==='Home'){commit(path,def);}});
  return root;
}

/* ---- Toggle button with LED ---- */
function mkToggle(d){

  const b=el('button',{class:'tgl c-'+(d.color||'green')+' '+(d.cls||''),type:'button','aria-pressed':'false'});

  bind(path,v=>{b.classList.toggle('on',!!v);b.setAttribute('aria-pressed',!!v);});

const METERS={};
class Meter{
  constructor(d){
    this.vert=d.orient!=='h';this.segs=d.segs?+d.segs:30;this.lo=-60;this.hi=0;
    this.root=el('div',{class:'meter '+(this.vert?'v':'h')+' '+(d.cls||'')});
    this.cv=el('canvas');this.root.append(this.cv);
    this.clipLed=d.clip?el('i',{class:'cliplamp',title:'Clip'}):null;if(this.clipLed){this.root.append(this.clipLed);this.clipLed.addEventListener('click',()=>{this.clip=false;this.clipLed.classList.remove('on');});}
    this.lvl=-90;this.pk=-90;this.pkT=0;this.clip=false;this.w=0;this.h=0;
    this.id=d.id;if(d.id)METERS[d.id]=this;
    this.dirty=true;
  }
  resize(){
    const r=this.cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
    const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));
    if(w!==this.cv.width||h!==this.cv.height){this.cv.width=w;this.cv.height=h;this.dirty=true;}
  }
  push(peakDb,now,holdS){
    // fast attack, ~24 dB/s decay
    if(peakDb>this.lvl)this.lvl=peakDb;else this.lvl=Math.max(peakDb,this.lvl-1.1);
    if(peakDb>=this.pk){this.pk=peakDb;this.pkT=now;}else if(now-this.pkT>holdS*1000)this.pk=Math.max(peakDb,this.pk-0.8);
    if(peakDb>=-0.3&&this.clipLed){this.clip=true;this.clipLed.classList.add('on');}
    this.draw();
  }
  draw(){
    this.resize();const c=this.cv,g=c.getContext('2d'),W=c.width,H=c.height;
    g.clearRect(0,0,W,H);
    const n=this.segs,vert=this.vert,gap=Math.max(1,Math.round((vert?H:W)/n*0.18));
    const segLen=((vert?H:W)-gap*(n-1))/n;
    for(let i=0;i<n;i++){
      const db=this.lo+(i+1)/n*(this.hi-this.lo);
      const on=this.lvl>=db-(this.hi-this.lo)/n*0.5;
      const isPk=Math.abs(this.pk-db)<(this.hi-this.lo)/n*0.5+0.01;
      const col=db>-6?[255,64,64]:db>-18?[255,176,46]:[52,214,122];
      const a=on||isPk?1:0.13;
      g.fillStyle=`rgba(${col[0]},${col[1]},${col[2]},${a})`;
      const p=i*(segLen+gap);
      if(vert)g.fillRect(0,H-p-segLen,W,segLen);else g.fillRect(p,0,segLen,H);
    }
  }
}

/* ================= Audio Engine ================= */
const E={ctx:null,wk:false,strips:{},streams:{},srcNodes:{},hold:{},meterBuf:new Float32Array(1024),started:false,fxIRTimer:0,duck:{g:1,last:0},micEnv:-120};
const EQ_FREQS=[63,125,250,500,1000,2000,4000,6300,12000];
const HUM_N=3;

/* Chrome/Blink DynamicsCompressor adds an automatic make-up gain; remove it so the user's MAKEUP knob is the only make-up */
function blinkMakeupDb(thr,ratio,knee){if(thr>=0||ratio<=1)return 0;const te=Math.min(0,thr+0.46*(knee||0));return -0.6*te*(1-1/ratio);}

  node.threshold.setTargetAtTime(thr,now,.02);node.ratio.setTargetAtTime(ratio,now,.02);node.knee.setTargetAtTime(knee,now,.02);
  node.attack.setTargetAtTime(Math.max(.0005,(o.att??10)/1000),now,.02);node.release.setTargetAtTime(Math.max(.01,(o.rel??150)/1000),now,.02);

const sm=(p,v,tc=.02)=>p.setTargetAtTime(v,E.ctx.currentTime,tc);
function chain(...ns){for(let i=0;i<ns.length-1;i++)ns[i].connect(ns[i+1]);return ns[ns.length-1];}

async function loadWorklets(){

function mkStrip(key,o){

    n.nrIn=gn(1);tail.connect(n.nrIn);n.nrSum=gn(1);n.nrDry=gn(1);n.nrWet=gn(0);
    n.nrIn.connect(n.nrDry);n.nrDry.connect(n.nrSum);

      n.nr=new AudioWorkletNode(c,'mx-nr',{numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[1],channelCount:1,channelCountMode:'explicit'});
      n.nrIn.connect(n.nr);n.nr.connect(n.nrWet);n.nrWet.connect(n.nrSum);
      n.nr.port.onmessage=e=>{const d=e.data;if(d.type==='learned')document.dispatchEvent(new Event('nrlearned'));else if(d.type==='progress')document.dispatchEvent(new CustomEvent('nrprogress',{detail:d.p}));};

    n.opt=[150,300,700,1500,3500,8000].map(f=>bq('peaking',f,.9,0));

function buildGraph(){

  // music: element -> gate -> duck -> strip
  E.music=new Audio();E.music.preload='auto';E.music.crossOrigin='anonymous';
  E.musicSrc=c.createMediaElementSource(E.music);E.musicGate=gn(1);E.duckG=gn(1);
  E.musicSrc.connect(E.musicGate);E.musicGate.connect(E.duckG);E.duckG.connect(S1.ch2.in);
  E.aux=new Audio();E.aux.loop=true;E.auxSrc=c.createMediaElementSource(E.aux);E.auxSrc.connect(S1.ch4.in);
  // FX engine on mic 1
  E.fx=new FXEngine(c);
  const s1=S1.ch1;
  s1.fxDry=gn(1);s1.mixOut=gn(1);
  s1.muteG.disconnect();
  // reroute: strip1: out is a post-mute node; insert fx dry/wet between muteG and out
  s1.muteG.connect(s1.fxDry);s1.fxDry.connect(s1.out);
  s1.muteG.connect(E.fx.input);
  s1.out.connect(s1.mixOut);E.fx.output.connect(s1.mixOut);
  // buses & SIP gates
  E.sum=gn(1);
  const mixOut={ch1:s1.mixOut,ch2:S1.ch2.out,ch3:S1.ch3.out,ch4:S1.ch4.out};
  E.micBus=gn(1);E.mixBus=gn(1);
  s1.mixOut.connect(E.micBus);S1.ch3.out.connect(E.micBus);E.micBus.connect(E.mixBus);S1.ch2.out.connect(E.mixBus);
  for(const k of['ch1','ch2','ch3','ch4']){const g=gn(1);mixOut[k].connect(g);g.connect(E.sum);S1[k].sip=g;}
  // cue bus (PFL)

  // master chain

  M.comp=newComp();M.compMk=gn(1);M.vol=gn(0);M.anPre=an(1024);

/* dyn worklet feedback: ducking driver + gate lamps */
function onDyn(d){
  E.micEnv=d.lvl>0?linToDb(d.lvl):-120;E.dynInfo=d;
  const dk=S.ch2.duck;
  if(!E.ctx||!E.duckG)return;
  const now=E.ctx.currentTime;
  if(dk.on&&E.micEnv>dk.thr&&!S.ch1.mute&&S.ch1.on){E.duck.last=now;}
  const speaking=dk.on&&(now-E.duck.last)*1000<dk.hold;
  const target=speaking?dbToLin(dk.amt):1;
  if(target!==E.duck.target||!E.duck.set){E.duck.target=target;E.duck.set=true;
    E.duckG.gain.setTargetAtTime(target,now,Math.max(.01,(speaking?dk.att:dk.rel)/1000/3));}
  E.duck.on=speaking;
}
setInterval(()=>{ // release duck even if the worklet stops posting (mic off)
  if(!E.ctx||!E.duckG||!S.ch2.duck)return;const dk=S.ch2.duck,now=E.ctx.currentTime;
  const speaking=dk.on&&(now-E.duck.last)*1000<dk.hold;
  if(!speaking&&E.duck.target!==1){E.duck.target=1;E.duckG.gain.setTargetAtTime(1,now,Math.max(.01,dk.rel/3000));E.duck.on=false;}
  if(!dk.on&&E.duck.target!==1){E.duck.target=1;E.duckG.gain.setTargetAtTime(1,now,.05);}
},200);

/* ---------- parameter application ---------- */
function applyStripCommon(k){
  const n=E.strips[k],s=S[k],now=E.ctx.currentTime;
  sm(n.trim.gain,dbToLin(s.trim));
  n.hpf.frequency.setTargetAtTime(s.hpf.on?s.hpf.f:10,now,.02);
  n.lpf.frequency.setTargetAtTime(s.lpf&&s.lpf.on?s.lpf.f:Math.min(20000,E.ctx.sampleRate/2-100),now,.02);
  n.eqLow.gain.setTargetAtTime(s.eq.low,now,.02);
  n.eqMid.frequency.setTargetAtTime(s.eq.midf||1000,now,.02);n.eqMid.gain.setTargetAtTime(s.eq.mid,now,.02);
  n.eqHigh.gain.setTargetAtTime(s.eq.high,now,.02);
  if(n.eqPres)n.eqPres.gain.setTargetAtTime(s.eq.pres,now,.02);
  setComp(n.comp,n.compMk,s.comp);
  n.pan.pan.setTargetAtTime(s.pan,now,.02);
  n.fader.gain.setTargetAtTime(faderGain(s.fader),now,.025);
}
function applyCh1(){
  const n=E.strips.ch1,s=S.ch1,now=E.ctx.currentTime;applyStripCommon('ch1');
  // hum notches
  n.hum.forEach((h,i)=>{h.type=s.hum.on?'notch':'allpass';h.frequency.setTargetAtTime(s.hum.hz*(i+1),now,.02);});
  // noise reduction crossfade + worklet cfg
  if(n.nr){
    n.nr.port.postMessage({cmd:'cfg',enabled:s.nr.on,floorDb:s.nr.floor,over:s.nr.over});
    sm(n.nrWet.gain,s.nr.on?1:0,.015);sm(n.nrDry.gain,s.nr.on?0:1,.015);
    n.dyn.port.postMessage({cmd:'cfg',gate:s.gate,deess:s.deess,breath:s.breath,agc:s.agc});
  }
  // vocal enhancement
  const e=s.enh;
  n.enh[0].gain.setTargetAtTime(e.clar.on?-3.5*e.clar.amt:0,now,.03);n.enh[1].gain.setTargetAtTime(e.clar.on?3*e.clar.amt:0,now,.03);
  n.enh[2].gain.setTargetAtTime(e.air.on?6*e.air.amt:0,now,.03);n.enh[3].gain.setTargetAtTime(e.air.on?2*e.air.amt:0,now,.03);
  n.opt.forEach((f,i)=>f.gain.setTargetAtTime(e.opt.on?e.opt.g[i]:0,now,.05));
  n.peq.forEach((f,i)=>{const b=s.peq.b[i];f.frequency.setTargetAtTime(b.f,now,.02);f.Q.setTargetAtTime(b.q,now,.02);f.gain.setTargetAtTime(s.peq.on?b.g:0,now,.02);});
  // limiter
  setComp(n.lim,n.limMk,{on:s.lim.on,thr:s.lim.thr,ratio:20,knee:0,att:1,rel:80,makeup:0});
  // A/B bypass

}
APPLY.ch1=()=>{if(E.ctx){applyCh1();updateInputOn('ch1');}};
APPLY.ch2=()=>{if(!E.ctx)return;applyStripCommon('ch2');if(E.music)E.music.volume=clamp(S.ch2.vol,0,1);applyMix();};
APPLY.ch3=()=>{if(!E.ctx)return;applyStripCommon('ch3');applyMix();updateInputOn('ch3');};
APPLY.ch4=()=>{if(!E.ctx)return;applyStripCommon('ch4');applyMix();updateInputOn('ch4');};

function anySolo(){return['ch1','ch2','ch3','ch4'].some(k=>S[k].solo);}
function soloMode(){return E.hpActive?'pfl':'sip';}
function applyMix(){
  if(!E.ctx)return;
  const solo=anySolo(),mode=soloMode(),now=E.ctx.currentTime;
  for(const k of['ch1','ch2','ch3','ch4']){
    const n=E.strips[k],s=S[k];
    const open=s.on&&!s.mute;
    n.muteG.gain.setTargetAtTime(open?1:0,now,.02);
    n.sip.gain.setTargetAtTime(solo&&mode==='sip'&&!s.solo?0:1,now,.03);
    n.cue.gain.setTargetAtTime(mode==='pfl'&&s.solo?1:0,now,.02);
  }
  const m=E.m;
  m.hpSel.gain.setTargetAtTime(solo&&mode==='pfl'?0:1,now,.03);m.hpCue.gain.setTargetAtTime(solo&&mode==='pfl'?1:0,now,.03);
  document.dispatchEvent(new Event('solochange'));
}
APPLY.master=(path)=>{
  if(!E.ctx)return;

function makeIR(c,type,p){
  const cfg=FXDEF[type].ir,sr=c.sampleRate,time=p.time,tone=p.tone;
  const len=Math.max(1024,Math.floor(Math.min(time*1.12+0.15,11)*sr)),buf=c.createBuffer(2,len,sr);
  const rampN=Math.max(1,Math.floor(cfg.ramp/1000*sr));
  let e2=0;
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);let y=0,seed=(ch+1)*7919+((time*100)|0)*31;
    const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296*2-1;};
    const f0=1500+tone*17000,f1=300+tone*2800,k=Math.log(f1/f0);
    for(let i=0;i<len;i++){
      const tt=i/sr,frac=Math.min(1,tt/time);
      const fc=f0*Math.exp(k*frac),a=1-Math.exp(-2*Math.PI*fc/sr);
      y+=a*(rnd()-y);
      const env=Math.pow(10,-3*tt/time)*Math.min(1,i/rampN);
      d[i]=y*env;
    }
    // early reflections
    if(cfg.early>0){
      const n=12;let tp=0.004*cfg.size;
      for(let j=0;j<n;j++){
        tp+=(0.003+Math.abs(rnd())*0.011)*cfg.size*1.6;
        const idx=Math.floor(tp*sr);if(idx>=len)break;
        const amp=(rnd()>0?1:-1)*cfg.early*0.9*Math.pow(0.86,j)*(0.6+Math.abs(rnd())*0.4);
        d[idx]+=amp;if(idx+1<len)d[idx+1]+=amp*0.5;
      }
    }
  }
  // normalise energy so that wet level is consistent between types
  let en=0;for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)en+=d[i]*d[i];}
  const sc=Math.sqrt(0.25/(en/2));
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]*=sc;}
  return buf;
}

    if(key===this.irKey)return;this.irKey=key;
    const go=()=>{
      const buf=makeIR(this.c,type,p),nxt=1-this.active,now=this.c.currentTime;
      this.slots[nxt].cv.buffer=buf;
      this.slots[nxt].g.gain.cancelScheduledValues(now);this.slots[nxt].g.gain.setValueAtTime(this.slots[nxt].g.gain.value,now);this.slots[nxt].g.gain.linearRampToValueAtTime(1,now+0.08);
      const o=this.slots[this.active].g.gain;o.cancelScheduledValues(now);o.setValueAtTime(o.value,now);o.linearRampToValueAtTime(0,now+0.08);
      this.active=nxt;
    };
    clearTimeout(this.irTimer);
    if(immediate)go();else this.irTimer=setTimeout(go,140);
  }
  apply(){
    const f=S.fx,d=FXDEF[f.type],p=f.cur,c=this.c,now=c.currentTime,on=f.on;
    const kind=d.kind,useRev=kind==='rev'||kind==='both',useEcho=kind==='echo'||kind==='both',useMod=kind==='mod';
    const s1=E.strips.ch1;
    const ang=p.mix*Math.PI/2;
    s1.fxDry.gain.setTargetAtTime(on?Math.cos(ang):1,now,.03);
    this.output.gain.setTargetAtTime(on?Math.sin(ang)*p.ret*0.9:0,now,.03);
    // reverb
    this.revIn.gain.setTargetAtTime(on&&useRev?1:0,now,.03);
    this.preD.delayTime.setTargetAtTime(clamp(p.pre,0,.5),now,.02);
    if(useRev&&on)this.setIR(f.type,p,!this.irKey||this.irKey.split('|')[0]!==f.type&&false);
    // echo
    this.echoIn.gain.setTargetAtTime(on&&useEcho?1:0,now,.03);
    const mode=d.mode,fb=clamp(p.fb,0,.9);
    this.dL.delayTime.setTargetAtTime(p.echo,now,.04);this.dR.delayTime.setTargetAtTime(p.echo*(mode==='mono'?1.07:1),now,.04);
    this.inL.gain.value=1;this.inR.gain.setTargetAtTime(mode==='pp'?0:1,now,.02);
    this.fLL.gain.setTargetAtTime(mode==='pp'?0:fb,now,.02);this.fRR.gain.setTargetAtTime(mode==='pp'?0:fb,now,.02);
    this.fLR.gain.setTargetAtTime(mode==='pp'?fb:0,now,.02);this.fRL.gain.setTargetAtTime(mode==='pp'?fb:0,now,.02);
    const tf=500*Math.pow(28,p.tone);this.tL.frequency.setTargetAtTime(tf,now,.03);this.tR.frequency.setTargetAtTime(tf,now,.03);
    this.eoL.gain.setTargetAtTime(p.rep,now,.02);this.eoR.gain.setTargetAtTime(p.rep,now,.02);
    // modulation
    this.modIn.gain.setTargetAtTime(on&&useMod?1:0,now,.03);
    const dbl=f.type==='doubling';
    this.m1.delayTime.setTargetAtTime(dbl?.024:.017,now,.05);this.m2.delayTime.setTargetAtTime(dbl?.034:.023,now,.05);
    this.l1.frequency.setTargetAtTime(p.rate,now,.1);this.l2.frequency.setTargetAtTime(p.rate*1.13,now,.1);
    const amp=p.depth*(dbl?.0025:.007);this.a1.gain.setTargetAtTime(amp,now,.05);this.a2.gain.setTargetAtTime(amp,now,.05);
    // width
    const w=p.width;this.wLL.gain.setTargetAtTime((1+w)/2,now,.03);this.wRR.gain.setTargetAtTime((1+w)/2,now,.03);
    this.wLR.gain.setTargetAtTime((1-w)/2,now,.03);this.wRL.gain.setTargetAtTime((1-w)/2,now,.03);
  }
}

/* --- LCD effect display --- */
function drawFxLcd(){
  const root=$('#fxLcd');if(!root||!S.fx.cur)return;
  const f=S.fx,d=FXDEF[f.type],p=f.cur,idx=FX_TYPES.indexOf(f.type)+1;
  $('#lcdNum').textContent=String(idx).padStart(2,'0');
  $('#lcdName').textContent=t('fx_'+f.type);
  $('#lcdKind').textContent=t('kind_'+d.kind);
  $('#lcdState').textContent=f.on?t('chOn'):'OFF';$('#lcdState').classList.toggle('off',!f.on);
  const names=FXKIND[d.kind];
  $('#lcdParams').innerHTML=names.map(k=>`<span><b>${t(FXP[k].l)}</b> ${FMT[FXP[k].fmt](p[k])}</span>`).join('');
  const cv=$('#lcdCv'),dpr=Math.min(2,window.devicePixelRatio||1),r=cv.getBoundingClientRect(),w=Math.round(r.width*dpr),h=Math.round(r.height*dpr);
  if(w<4||h<4)return;if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  const g=cv.getContext('2d');g.clearRect(0,0,w,h);
  const cs=getComputedStyle(root),col=cs.getPropertyValue('--lcd').trim()||'#ffb02e';
  g.strokeStyle='rgba(255,176,46,.12)';g.lineWidth=1;
  for(let i=1;i<4;i++){g.beginPath();g.moveTo(0,h*i/4);g.lineTo(w,h*i/4);g.stroke();}
  g.strokeStyle=col;g.fillStyle=col;g.lineWidth=Math.max(1.5,dpr*1.5);
  const kind=d.kind,span=kind==='echo'||kind==='both'?Math.max(p.echo*5,1):Math.max(p.time*1.1,1);
  const X=tt=>tt/span*w;
  if(kind==='rev'||kind==='both'){
    g.beginPath();g.moveTo(X(p.pre),h*0.1);
    for(let i=0;i<=60;i++){const tt=p.pre+(p.time)*i/60;const db=-60*(tt-p.pre)/p.time;g.lineTo(X(tt),h*0.1+(-db/60)*h*0.8);}
    g.stroke();
    g.globalAlpha=.25;g.lineTo(X(p.pre+p.time),h);g.lineTo(X(p.pre),h);g.fill();g.globalAlpha=1;
  }
  if(kind==='echo'||kind==='both'){
    let a=p.rep;const pp=d.mode==='pp';
    for(let n=1;n<=14&&a>0.02;n++){
      const x=X(p.echo*n),bh=a*h*0.8;
      g.globalAlpha=kind==='both'?0.7:1;g.fillStyle=pp&&n%2===0?'#7fd4ff':col;
      g.fillRect(x-dpr,h-bh,Math.max(2,dpr*2.5),bh);a*=Math.max(0.0001,p.fb);
    }
    g.globalAlpha=1;
  }
  if(kind==='mod'){
    g.beginPath();for(let i=0;i<w;i++){const v=Math.sin(i/w*Math.PI*2*(2+p.rate*1.5));g.lineTo(i,h/2+v*h*0.12*(0.3+p.depth*1.4)*1.5);}g.stroke();
    g.globalAlpha=.5;g.beginPath();for(let i=0;i<w;i++){const v=Math.sin(i/w*Math.PI*2*(2+p.rate*1.5*1.13)+1.2);g.lineTo(i,h/2+v*h*0.12*(0.3+p.depth*1.4)*1.5);}g.stroke();g.globalAlpha=1;
  }
  // time axis label
  g.fillStyle='rgba(255,176,46,.6)';g.font=`${Math.round(h*0.14)}px monospace`;g.textAlign='right';
  g.fillText(kind==='mod'?'':span.toFixed(1)+' s',w-4,h-4);
}
document.addEventListener('langchange',()=>drawFxLcd());

/* ================= Background audio player + local library ================= */
const LIB={items:[],cur:-1,filter:'all',repeat:'off',shuffle:false,playing:false,db:null,seq:0};
const AUDIO_EXT=/\.(mp3|wav|wave|ogg|oga|opus|m4a|aac|flac|webm|mp4)$/i;
function idbOpen(){
  return new Promise(res=>{
    if(!window.indexedDB)return res(null);
    try{const r=indexedDB.open('maddah-console',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});
      r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}
  });
}
const idbTx=(mode,fn)=>new Promise(res=>{if(!LIB.db)return res(null);try{const tx=LIB.db.transaction('files',mode),st=tx.objectStore('files');const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>res(null);}catch(e){res(null);}});
const idbPut=it=>idbTx('readwrite',s=>s.put({id:it.id,name:it.name,cat:it.cat,blob:it.blob,dur:it.dur,order:it.order}));
const idbDel=id=>idbTx('readwrite',s=>s.delete(id));
const idbClear=()=>idbTx('readwrite',s=>s.clear());
const idbAll=()=>idbTx('readonly',s=>s.getAll());

async function libInit(){
  LIB.db=await idbOpen();
  const all=(await idbAll())||[];
  all.sort((a,b)=>(a.order||0)-(b.order||0));
  for(const r of all){LIB.items.push({id:r.id,name:r.name,cat:r.cat,blob:r.blob,url:URL.createObjectURL(r.blob),dur:r.dur||0,order:r.order||0});LIB.seq=Math.max(LIB.seq,(r.order||0)+1);}
  renderLib();
}
function getDuration(url){
  return new Promise(res=>{const a=new Audio();a.preload='metadata';const done=d=>{a.src='';res(d);};
    a.onloadedmetadata=()=>done(isFinite(a.duration)?a.duration:0);a.onerror=()=>done(-1);a.src=url;setTimeout(()=>done(0),6000);});
}
async function addFiles(files,cat){
  cat=cat||(LIB.filter!=='all'?LIB.filter:'other');
  let added=0;
  for(const f of files){
    if(!(f.type&&f.type.startsWith('audio/'))&&!AUDIO_EXT.test(f.name))continue;
    const it={id:'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:f.name.replace(/\.[^.]+$/,''),cat,blob:f,url:URL.createObjectURL(f),dur:0,order:LIB.seq++};
    it.dur=await getDuration(it.url);
    if(it.dur<0){toast(t('unsupported')+' '+f.name,'err');URL.revokeObjectURL(it.url);continue;}
    LIB.items.push(it);added++;
    if(S.set.keepLib)idbPut(it);
  }
  renderLib();return added;
}
async function pickFiles(){
  if(window.showOpenFilePicker&&!/Android/i.test(navigator.userAgent)){
    try{
      const hs=await window.showOpenFilePicker({multiple:true,types:[{description:'Audio',accept:{'audio/*':['.mp3','.wav','.ogg','.m4a','.aac','.flac','.opus']}}]});
      const files=await Promise.all(hs.map(h=>h.getFile()));await addFiles(files);return;
    }catch(e){if(e&&e.name==='AbortError')return;}
  }
  $('#fileIn').click();
}
function queue(){return LIB.items.map((it,i)=>({it,i})).filter(x=>LIB.filter==='all'||x.it.cat===LIB.filter);}
function renderLib(){
  const box=$('#plist');if(!box)return;box.innerHTML='';
  const q=queue();
  $$('#catTabs button').forEach(b=>{const k=b.dataset.cat;const n=k==='all'?LIB.items.length:LIB.items.filter(x=>x.cat===k).length;b.dataset.n=n;b.classList.toggle('on',k===LIB.filter);});
  if(!q.length){box.append(el('div',{class:'empty','data-i18n':'emptyLib'},t('emptyLib')));return;}
  q.forEach(({it,i},n)=>{
    const row=el('div',{class:'prow'+(i===LIB.cur?' cur':'')+(i===LIB.cur&&LIB.playing?' playing':'')});
    const sel=el('select',{class:'sel mini','aria-label':'category'});CATS.forEach(c=>{const o=el('option',{value:c},t('cat_'+c));if(c===it.cat)o.selected=true;sel.append(o);});
    sel.addEventListener('click',e=>e.stopPropagation());
    sel.addEventListener('change',()=>{it.cat=sel.value;if(S.set.keepLib)idbPut(it);renderLib();});
    const rm=el('button',{class:'ico',type:'button',title:t('remove'),'aria-label':t('remove')},'✕');
    rm.addEventListener('click',e=>{e.stopPropagation();removeTrack(i);});
    const nm=el('span',{class:'pname'},it.name);
    row.append(el('span',{class:'pn'},String(n+1)),nm,el('span',{class:'pdur'},it.dur?fmtClock(it.dur):'--'),sel,rm);
    row.addEventListener('click',()=>playIndex(i));
    box.append(row);
  });
}
function removeTrack(i){
  const it=LIB.items[i];if(!it)return;
  if(i===LIB.cur){musicStop(true);LIB.cur=-1;E.music&&(E.music.removeAttribute('src'));}
  else if(i<LIB.cur)LIB.cur--;
  URL.revokeObjectURL(it.url);LIB.items.splice(i,1);idbDel(it.id);renderLib();updateNow();
}
async function playIndex(i){
  const it=LIB.items[i];if(!it)return;
  await engineStart();
  LIB.cur=i;E.music.src=it.url;E.music.volume=clamp(S.ch2.vol,0,1);
  await musicPlay();renderLib();updateNow();
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:it.name,artist:'Maddah Console'});}catch(e){}}
}
async function musicPlay(){
  await engineStart();
  if(LIB.cur<0){const q=queue();if(!q.length){toast(t('emptyLib'));return;}return playIndex(q[0].i);}
  if(!E.music.src||E.music.src===location.href){E.music.src=LIB.items[LIB.cur].url;}
  const g=E.musicGate.gain,now=E.ctx.currentTime;g.cancelScheduledValues(now);g.setValueAtTime(0,now);
  try{await E.music.play();g.linearRampToValueAtTime(1,E.ctx.currentTime+0.06);LIB.playing=true;}
  catch(e){g.setValueAtTime(1,E.ctx.currentTime);console.warn('play',e);if(e.name!=='AbortError')toast(t('unsupported')+' '+(LIB.items[LIB.cur]?.name||''),'err');}
  updateNow();renderLib();
}
function musicPause(){
  if(!E.music||!E.ctx)return;const g=E.musicGate.gain,now=E.ctx.currentTime;g.cancelScheduledValues(now);g.setValueAtTime(g.value,now);g.linearRampToValueAtTime(0,now+0.06);
  LIB.playing=false;setTimeout(()=>{if(!LIB.playing)E.music.pause();},75);updateNow();renderLib();
}
function musicStop(quick){
  if(!E.music||!E.ctx)return;musicPause();
  setTimeout(()=>{if(!LIB.playing){try{E.music.currentTime=0;}catch(e){}updateNow();}},90);
}
function nextIndex(dir,auto){
  const q=queue();if(!q.length)return -1;
  const pos=q.findIndex(x=>x.i===LIB.cur);
  if(LIB.shuffle&&q.length>1){let r;do{r=Math.floor(Math.random()*q.length);}while(r===pos);return q[r].i;}
  let np=pos+dir;
  if(np>=q.length){if(LIB.repeat==='all'||!auto)np=0;else return -1;}
  if(np<0)np=q.length-1;
  return q[np].i;
}
function musicNext(auto){const i=nextIndex(1,auto);if(i<0){musicStop();return;}playIndex(i);}
function musicPrev(){if(E.music&&E.music.currentTime>3){E.music.currentTime=0;return;}const i=nextIndex(-1);if(i>=0)playIndex(i);}
function updateNow(){
  const it=LIB.items[LIB.cur],a=E&&E.music;
  $('#npName').textContent=it?it.name:t('noTrack');
  const cur=a&&it?a.currentTime:0,dur=it?(a&&isFinite(a.duration)?a.duration:it.dur):0;
  $('#npTime').textContent=fmtClock(cur)+' / '+fmtClock(dur);
  const pr=$('#npProg');if(pr&&!pr.dataset.drag)pr.value=dur?Math.round(cur/dur*1000):0;
  $('#btnPlay').classList.toggle('on',LIB.playing);
  $('#npLed').classList.toggle('on',LIB.playing);
}
function playerInit(){
  const a=E.music;
  a.addEventListener('timeupdate',updateNow);
  a.addEventListener('ended',()=>{
    if(LIB.repeat==='one'){a.currentTime=0;a.play();return;}
    musicNext(true);
  });
  a.addEventListener('error',()=>{if(a.src&&a.src!==location.href){toast(t('unsupported')+' '+(LIB.items[LIB.cur]?.name||''),'err');LIB.playing=false;updateNow();renderLib();}});
  a.addEventListener('loadedmetadata',()=>{const it=LIB.items[LIB.cur];if(it&&isFinite(a.duration)&&!it.dur){it.dur=a.duration;renderLib();}updateNow();});
  if('mediaSession' in navigator){
    const ms=navigator.mediaSession;
    [['play',()=>musicPlay()],['pause',musicPause],['stop',musicStop],['nexttrack',()=>musicNext(false)],['previoustrack',musicPrev]].forEach(([k,f])=>{try{ms.setActionHandler(k,f);}catch(e){}});
  }
}
function playerUI(){

  pr.addEventListener('change',()=>{const a=E.music;if(a&&isFinite(a.duration))a.currentTime=pr.value/1000*a.duration;delete pr.dataset.drag;});

  });
  $('#btnAux').addEventListener('click',()=>$('#auxIn').click());

/* ================= Recorder, preview, export ================= */
const REC={
  state:'idle',tr:null,nodes:[],takes:[],seq:1,
  active(){return this.state!=='idle';},
  tracksCfg(){
    const src=S.rec.src,c=[{k:'orig',ch:1,tap:E.strips.ch1.trim},{k:'proc',ch:2,tap:E.micBus}];
    if(src==='micmusic')c.push({k:'final',ch:2,tap:E.mixBus});else if(src==='master')c.push({k:'final',ch:2,tap:E.m.tap});
    return c;
  },
  async start(){
    await engineStart();
    if(!E.wk){toast('AudioWorklet required for recording','err');return;}
    if(S.rec.src!=='master'||!LIB.playing){if(!E.streams.ch1){const m=!window.isSecureContext||!navigator.mediaDevices?t('micNoApi'):(INPUT_STATUS.ch1&&INPUT_STATUS.ch1.msg)||t('recNoMic');toast(t('recNoMic'),'err');alert(t('recNoMic')+'\n\n'+m);return;}}
    this.tr={};this.nodes=[];
    for(const c of this.tracksCfg()){
      const n=new AudioWorkletNode(E.ctx,'mx-rec',{processorOptions:{ch:c.ch},numberOfInputs:1,numberOfOutputs:1,outputChannelCount:[c.ch],channelCount:c.ch,channelCountMode:'explicit'});
      const tr={ch:c.ch,chunks:Array.from({length:c.ch},()=>[]),n:0};this.tr[c.k]=tr;
      n.port.onmessage=e=>{const d=e.data;if(d.chunks){d.chunks.forEach((a,i)=>tr.chunks[i].push(a));tr.n+=d.n;}};
      c.tap.connect(n);n.connect(E.zero);this.nodes.push({n,tap:c.tap});
    }
    this.nodes.forEach(x=>x.n.port.postMessage({cmd:'rec',on:true}));
    this.state='recording';this.ui();applyLiveOut();
  },
  pause(){this.nodes.forEach(x=>x.n.port.postMessage({cmd:'rec',on:false}));this.state='paused';this.ui();},
  resume(){this.nodes.forEach(x=>x.n.port.postMessage({cmd:'rec',on:true}));this.state='recording';this.ui();},
  async stop(){
    this.nodes.forEach(x=>x.n.port.postMessage({cmd:'rec',on:false}));
    await sleep(150);
    this.nodes.forEach(x=>{try{x.tap.disconnect(x.n);x.n.disconnect();}catch(e){}});this.nodes=[];
    const sr=E.ctx.sampleRate,take={id:Date.now(),name:'Take '+(this.seq++),sr,src:S.rec.src,buf:{}};
    for(const k in this.tr){
      const t=this.tr[k];if(!t.n)continue;
      const b=E.ctx.createBuffer(t.ch,t.n,sr);
      for(let c=0;c<t.ch;c++){const d=b.getChannelData(c);let o=0;for(const a of t.chunks[c]){d.set(a,o);o+=a.length;}}
      take.buf[k]=b;
    }
    this.tr=null;this.state='idle';applyLiveOut();this.ui();
    if(!take.buf.orig){toast('Empty recording','err');return;}
    this.takes.push(take);if(this.takes.length>4)this.takes.shift();
    this.fillTakes();PV.open(take);
  },
  tick(){
    const el_=document.getElementById('recTime');if(!el_)return;
    const t=this.tr&&this.tr.orig?this.tr.orig.n/E.ctx.sampleRate:0;
    el_.textContent=fmtClock(t);
    const mem=document.getElementById('recMem');if(mem&&this.tr){let b=0;for(const k in this.tr)b+=this.tr[k].n*this.tr[k].ch*4;mem.textContent=fmtBytes(b);if(t>1200&&!this.warned){this.warned=1;toast(t('recLong'),'err');}}
    const led=document.getElementById('recLed');if(led)led.classList.toggle('on',this.state==='recording'&&(performance.now()%1000<600));
  },
  ui(){
    const s=this.state,set=(id,v)=>{const n=document.getElementById(id);if(n)n.disabled=v;};
    set('recBtn',s!=='idle');set('recPauseBtn',s==='idle');set('recStopBtn',s==='idle');
    const p=document.getElementById('recPauseBtn');if(p)p.firstElementChild.textContent=t(s==='paused'?'recResume':'recPause');
    const st=document.getElementById('recStatus');if(st)st.textContent=t(s==='idle'?'recIdle':s==='paused'?'recPaused':'recRecording');
    if(s==='idle')this.warned=0;
  },

/* ---------- analysis helpers ---------- */

function qualityHtml(a){

  let msg=[];if(a.peak<-100)msg.push(t('qSilent'));else if(a.clip>0)msg.push(t('qWarnClip'));else if(a.peak>-0.5)msg.push(t('qWarnHot'));if(a.peak<-30&&a.peak>=-100)msg.push(t('qWarnQuiet'));if(a.peak>=-100&&a.noise>-45&&a.rms>-60)msg.push(t('qWarnNoise'));

    for(let x=0;x<W;x++){let mn=0,mx=0;const s=Math.floor(x*per),e=Math.min(n,Math.floor((x+1)*per));for(let i=s;i<e;i+=Math.max(1,(e-s)>>6)){const v=d[i];if(v<mn)mn=v;if(v>mx)mx=v;}p[x*2]=mn;p[x*2+1]=mx;}this.peaks=p;},

async function optimizeEQ(){
  if(!E.strips.ch1||!E.streams.ch1){toast(t('micFail'),'err');return;}
  const a=an(4096),tap=E.strips.ch1.trim;tap.connect(a);const bins=a.frequencyBinCount,sr=E.ctx.sampleRate,buf=new Float32Array(bins);
  const C=[150,300,700,1500,3500,8000],edges=[0,...C.slice(1).map((f,i)=>Math.sqrt(f*C[i])),Math.min(sr/2,16000)];edges[0]=100;
  const sum=new Float64Array(6);let frames=0;$('#optBtn').disabled=true;
  for(let t0=performance.now();performance.now()-t0<6000;){
    await sleep(100);a.getFloatFrequencyData(buf);let tot=0;const bp=new Float64Array(6);
    for(let k=1;k<bins;k++){const f=k*sr/2/bins,p=Math.pow(10,buf[k]/10);for(let b=0;b<6;b++)if(f>=edges[b]&&f<edges[b+1])bp[b]+=p;}
    tot=bp.reduce((x,y)=>x+y);if(10*Math.log10(tot+1e-20)>-60){for(let b=0;b<6;b++)sum[b]+=bp[b];frames++;}
  }
  tap.disconnect(a);$('#optBtn').disabled=false;
  if(frames<10){toast(t('optQuiet'),'err');return;}
  const db=Array.from(sum,v=>10*Math.log10(v/frames+1e-20)),target=[4,3,0,-4,-9,-17];
  const rel=db.map((v,i)=>v-db[2]-target[i]);
  S.ch1.enh.opt.g=rel.map(r=>clamp(-r*0.5,-4,4));S.ch1.enh.opt.on=true;refreshBindings();applyCh1();saveSoon();toast(t('optDone'));
}

const HELP={en:`
<h3>1 · First start</h3><p>Press <b>POWER ON</b>, allow the microphone, choose your input device in MIC (and plug in headphones if you monitor on speakers nearby – a live microphone next to loudspeakers causes feedback). Set GAIN so the IN meter peaks around the amber area and never reaches red.</p>
<h3>2 · Android</h3><p>Open the page in <b>Chrome</b>. The microphone only works on <b>HTTPS</b> or <b>localhost</b>: a file opened from the file manager (file://) often cannot use the microphone. Easiest: host the file on any HTTPS site (e.g. GitHub Pages / Netlify Drop), open that address in Chrome, then menu ⋮ → <i>Add to Home screen / Install app</i>. Or run a local server (Termux: <code>python -m http.server</code> then open <code>http://localhost:8000</code>). Microphone permission: ⋮ → Settings → Site settings → Microphone → Allow (or tap the lock icon next to the address).</p>
<h3>3 · Your own music</h3><p>Press <b>ADD FILES</b> (or drop files onto the player). MP3, WAV, OGG and M4A work when the browser supports them. Pick a category tab first to file new songs there, or change a track's category in its row. Files never leave your device; with “remember library” they are stored in the browser's private storage. The MUSIC fader is independent from the microphone; AUTO-DUCK lowers music while you speak.</p>
<h3>4 · External sound system / interface</h3><p>Plug a USB audio interface or a USB-C audio adapter: it appears as input/output devices. Choose the interface as input in MIC and as <i>Main output</i> in the Master section (desktop Chrome/Edge; on Android the system routes audio to the connected device automatically). Connect the interface's line outputs to the PA/mixer. Keep the master near 0 dB and let the system's volume do the rest. A second output device enables headphone monitor and PFL solo; otherwise solo works in-place.</p>
<h3>5 · Recording & export</h3><p>Choose the source (mic only / mic + music / master), press RECORD, then STOP – the preview opens automatically. Compare ORIGINAL with PROCESSED, trim the ends by dragging the green handles, then EXPORT. WAV is lossless. MP3 needs an encoder that is loaded once from the internet (or a <code>lame.min.js</code> file placed next to the page). Nothing is uploaded.</p>
<h3>6 · What runs in the browser, what needs hardware</h3><p><b>In the browser:</b> all mixing, EQ, compressor, gate, de-esser, noise reduction, reverbs/echoes, music player, ducking, recording, WAV/MP3 export, presets. <b>Needs hardware:</b> a good microphone, an audio interface for balanced XLR/line connections and phantom power (48 V), and speakers/PA. A browser cannot create real zero-latency monitoring: expect roughly 20–60 ms (lower with an audio interface and the “lowest latency” mode). Noise reduction cannot remove every noise and cannot make a poor recording studio-quality.</p>`,
fa:`
<h3>۱ · شروع</h3><p>دکمه‌ی <b>روشن کردن</b> را بزنید، اجازه‌ی میکروفون بدهید و ورودی را در بخش میکروفون انتخاب کنید (اگر نزدیک بلندگو هستید از هدفون استفاده کنید؛ میکروفون کنار بلندگو سوت می‌کشد). گین را طوری تنظیم کنید که مترِ ورودی روی ناحیه‌ی نارنجی برسد و هرگز قرمز نشود.</p>
<h3>۲ · اندروید</h3><p>صفحه را در <b>Chrome</b> باز کنید. میکروفون فقط در <b>HTTPS</b> یا <b>localhost</b> کار می‌کند؛ فایلی که مستقیم از مدیر فایل باز شود (file://) معمولاً به میکروفون دسترسی ندارد. ساده‌ترین راه: فایل را روی یک سایت HTTPS (مثل GitHub Pages یا Netlify Drop) بگذارید، آدرس را در Chrome باز کنید و از منوی ⋮ گزینه‌ی «افزودن به صفحه‌ی اصلی / نصب برنامه» را بزنید. یا با Termux: <code>python -m http.server</code> و بازکردن <code>http://localhost:8000</code>. اجازه‌ی میکروفون: ⋮ ← تنظیمات ← تنظیمات سایت ← میکروفون ← مجاز (یا آیکن قفل کنار آدرس).</p>
<h3>۳ · موسیقی شخصی</h3><p>دکمه‌ی <b>افزودن فایل</b> را بزنید (یا فایل‌ها را روی پخش‌کننده رها کنید). MP3، WAV، OGG و M4A در صورت پشتیبانی مرورگر پخش می‌شوند. ابتدا تب دسته‌بندی را انتخاب کنید تا فایل‌ها همان‌جا ذخیره شوند، یا دسته را در ردیف هر فایل عوض کنید. فایل‌ها هرگز از دستگاه خارج نمی‌شوند. فیدر موسیقی مستقل از میکروفون است و دکینگ خودکار هنگام صحبت صدای موسیقی را کم می‌کند.</p>
<h3>۴ · اتصال به سیستم صدا / کارت صدا</h3><p>کارت صدای USB یا مبدل USB-C را وصل کنید؛ به‌صورت ورودی/خروجی ظاهر می‌شود. آن را به‌عنوان ورودی در بخش میکروفون و به‌عنوان «خروجی اصلی» در بخش مستر انتخاب کنید (Chrome/Edge دسکتاپ؛ در اندروید سیستم صدا را خودکار به دستگاه وصل‌شده می‌فرستد). خروجی‌های Line کارت صدا را به پاور/میکسر وصل کنید. مستر را نزدیک 0 دسی‌بل نگه دارید و بلندی را با ولوم سیستم تنظیم کنید. با انتخاب خروجی دوم، مانیتور هدفون و سولوی PFL فعال می‌شود؛ وگرنه سولو درجا عمل می‌کند.</p>
<h3>۵ · ضبط و خروجی</h3><p>منبع ضبط را انتخاب کنید (فقط میکروفون / میکروفون + موسیقی / مستر)، ضبط و سپس توقف را بزنید؛ پیش‌نمایش خودکار باز می‌شود. «اصلی» و «پردازش‌شده» را مقایسه کنید، ابتدا و انتها را با کشیدن دستگیره‌های سبز ببرید و خروجی بگیرید. WAV بدون اتلاف است. MP3 به رمزگذاری نیاز دارد که یک‌بار از اینترنت بارگذاری می‌شود (یا فایل <code>lame.min.js</code> کنار صفحه). هیچ چیزی آپلود نمی‌شود.</p>
<h3>۶ · چه چیزی در مرورگر انجام می‌شود و چه چیزی سخت‌افزار می‌خواهد</h3><p><b>در مرورگر:</b> میکس، EQ، کمپرسور، گیت، دی‌اس، کاهش نویز، ریورب و اکو، پخش‌کننده، دکینگ، ضبط، خروجی WAV/MP3 و پریست‌ها. <b>نیازمند سخت‌افزار:</b> میکروفون خوب، کارت صدا برای اتصال XLR/Line و فانتوم ۴۸ ولت، و بلندگو/پاور. مرورگر مانیتورینگ بدون تأخیر ندارد؛ حدود ۲۰ تا ۶۰ میلی‌ثانیه (با کارت صدا و حالت کمترین تأخیر کمتر). کاهش نویز همه‌ی نویزها را حذف نمی‌کند و ضبط ضعیف را استودیویی نمی‌کند.</p>`};
function helpInit(){
  const draw=()=>{$('#mHelp').innerHTML=`<div class="mbox wideb"><h2>${t('helpTitle')}</h2><div class="help">${HELP[LANG]}</div><div class="row"><button class="btn" id="helpClose">${t('close')}</button></div></div>`;$('#helpClose').onclick=()=>closeModal('mHelp');};
  draw();document.addEventListener('langchange',draw);$('#helpBtn').onclick=()=>openModal('mHelp');
}
function lampsInit(){
  const set=(id,on,cls)=>{const n=$('#'+id);if(n){n.classList.toggle('on',!!on);if(cls)n.classList.toggle(cls,!!on);}};
  const upd=()=>{set('stEngine',E.ctx&&E.ctx.state==='running');set('stMic',E.streams&&E.streams.ch1);set('stRec',REC.state==='recording');};
  ['enginestate','inputstatus'].forEach(e=>document.addEventListener(e,upd));setInterval(upd,500);
}

let fxFill;
function fxUI(){
 $$('.pad').forEach(b=>b.addEventListener('click',()=>setFxType(b.dataset.fx)));
 const mark=()=>{$$('.pad').forEach(b=>b.classList.toggle('on',b.dataset.fx===S.fx.type));const k=FXKIND[FXDEF[S.fx.type].kind];$$('.fxk').forEach(n=>n.classList.toggle('dim',!k.includes(n.dataset.fxp)));drawFxLcd();};
 document.addEventListener('fxtype',mark);mark();
 fxFill=()=>{const s=SELECTS.fxUserSel;s.innerHTML='<option value="">'+t('fxUser')+'</option>';FX_PRESETS.forEach((p,i)=>s.append(el('option',{value:i},p.name)));};
 fxFill();
 SELECTS.fxUserSel.addEventListener('change',e=>{const p=FX_PRESETS[+e.target.value];if(!p)return;S.fx.on=p.on;S.fx.p[p.type]=Object.assign({},p.cur);setFxType(p.type,true);S.fx.cur=Object.assign({},p.cur);refreshBindings();APPLY.fx();});
 $('#fxSave').onclick=async()=>{const n=await askText('fxSave',t('fx_'+S.fx.type));if(!n)return;FX_PRESETS.push({name:n,type:S.fx.type,on:S.fx.on,cur:Object.assign({},S.fx.cur)});fxFill();saveSoon();toast(t('fxSaved'));};
 $('#fxDel').onclick=()=>{const i=+SELECTS.fxUserSel.value;if(SELECTS.fxUserSel.value===''||isNaN(i))return;FX_PRESETS.splice(i,1);fxFill();saveSoon();};
 const apply=()=>{};
}
async function boot(){
 loadState();LANG=S.lang||'en';ensureFx();buildUI();fxUI();playerUI();studioInit();modeBar();settingsInit();helpInit();lampsInit();
 $('#btnAux2').onclick=()=>$('#btnAux').click();$('#btnAux').textContent='aux';
 $('#btnAux2').dataset.i18n='auxLoad';$('#btnAux2').textContent=t('auxLoad');
 setLang(LANG);
 $('#lang').onclick=()=>{S.lang=LANG==='en'?'fa':'en';setLang(S.lang);saveSoon();};
 $('#power').onclick=async()=>{
  try{await engineStart();playerInit();await libInit();$('#splash').hidden=true;}catch(e){console.error(e);toast(String(e),'err');}
 };
 if(!window.isSecureContext)$('#secWarn').hidden=false;
 const banner=()=>{const b=$('#micBanner'),live=E.streams&&E.streams.ch1,started=E.started,m=(INPUT_STATUS.ch1&&INPUT_STATUS.ch1.msg)||(!window.isSecureContext?t('micNoApi'):'');b.hidden=!(started&&S.ch1.on&&!live);b.textContent='⚠ '+t('bannerMic')+(m?' — '+m:'');};
 document.addEventListener('inputstatus',e=>{$('#micMsg').textContent=e.detail.msg||'';banner();});setInterval(banner,1000);
 window.addEventListener('beforeunload',saveState);
}
document.addEventListener('DOMContentLoaded',boot);
